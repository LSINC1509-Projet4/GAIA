<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - GAIA</title>
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="container"> <img src="static/Logo.png" alt="Logo GAIA">
        <h1>Connexion</h1>
        
        <form method="post">
            <input type="text" name="username" placeholder="Nom d'utilisateur" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            
            <div class="button-group"> <button type="submit">Se connecter</button>
                <button type="button">Créer un compte</button>
            </div>
        </form>
    </div>
</body>
</html>
