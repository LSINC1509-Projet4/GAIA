<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Publier une observation - GAIA</title>
        <link rel="icon" type="image/x-icon" href="static/Logo.png" />
        <style>
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #ccfcd4 0%, #9df8b4 100%);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                box-sizing: border-box;
            }

            .container {
                background-color: rgba(255, 255, 255, 0.9);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                width: 100%;
                max-width: 520px;
                box-sizing: border-box;
            }

            .header {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 28px;
            }

            .header img {
                width: 48px;
                height: auto;
            }

            h1 {
                font-size: 1.5rem;
                font-weight: 600;
                color: #333;
                margin: 0;
            }

            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #555;
                margin-bottom: 5px;
                margin-top: 14px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            input[type="text"],
            input[type="number"],
            textarea,
            input[type="file"] {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                background-color: #fff;
                font-size: 15px;
                font-family: inherit;
                box-sizing: border-box;
                outline: none;
                transition: border-color 0.2s;
            }

            input:focus,
            textarea:focus {
                border-color: #68d391;
            }

            textarea {
                resize: vertical;
                min-height: 80px;
            }

            .coords {
                display: flex;
                gap: 10px;
            }

            .coords > div {
                flex: 1;
            }

            .flash {
                color: #9b2c2c;
                background-color: #feb2b2;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 14px;
                border: 1px solid #f5c2c7;
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin-top: 24px;
            }

            button[type="submit"] {
                flex: 2;
                padding: 13px;
                border: none;
                border-radius: 8px;
                background-color: #2f855a;
                color: white;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s;
            }

            button[type="submit"]:hover {
                background-color: #276749;
            }

            .btn-back {
                flex: 1;
                padding: 13px;
                border: none;
                border-radius: 8px;
                background-color: #eee;
                color: #444;
                font-size: 15px;
                font-weight: 500;
                cursor: pointer;
                text-decoration: none;
                text-align: center;
                transition: background 0.2s;
            }

            .btn-back:hover {
                background-color: #ddd;
            }

            @media (max-width: 480px) {
                .container { padding: 25px 15px; }
                .button-group { flex-direction: column; }
                .coords { flex-direction: column; }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <img src="static/Logo.png" alt="GAIA Logo" onerror="this.style.display='none'" />
                <h1>Nouvelle observation</h1>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" enctype="multipart/form-data">
                <label for="Titre">Titre *</label>
                <input type="text" id="Titre" name="Titre" placeholder="Ex: Renard roux près de la forêt" required />

                <label for="Description">Description</label>
                <textarea id="Description" name="Description" placeholder="Décrivez votre observation..."></textarea>

                <label for="Localisation">Localisation *</label>
                <input type="text" id="Localisation" name="Localisation" placeholder="Ex: Forêt de Soignes, Bruxelles" required />

                <div class="coords">
                    <div>
                        <label for="Latitude">Latitude *</label>
                        <input type="number" id="Latitude" name="Latitude" step="any" placeholder="50.8503" required />
                    </div>
                    <div>
                        <label for="Longitude">Longitude *</label>
                        <input type="number" id="Longitude" name="Longitude" step="any" placeholder="4.3517" required />
                    </div>
                </div>

                <label for="Photo">Photo *</label>
                <input type="file" id="Photo" name="Photo" accept="image/*" required />

                <div class="button-group">
                    <a href="{{ url_for('main.index') }}" class="btn-back">Annuler</a>
                    <button type="submit">Publier</button>
                </div>
            </form>
        </div>
    </body>
</html>
