<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Publier une observation - GAIA</title>
        <link
            rel="icon"
            type="image/x-icon"
            href="{{ url_for('static', filename='Logo.png') }}"
        />

        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/publish.css') }}"
        />

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <img
                    src="{{ url_for('static', filename='Logo.png') }}"
                    alt="GAIA Logo"
                    onerror="this.style.display = 'none'"
                />
                <h1>Nouvelle observation</h1>
            </div>

            {% with messages = get_flashed_messages() %} {% if messages %} {%
            for message in messages %}
            <div class="flash">{{ message }}</div>
            {% endfor %} {% endif %} {% endwith %}

            <form method="post" enctype="multipart/form-data">
                <div class="suggestions-container">
                    <label for="Titre">Titre *</label>
                    <input
                        type="text"
                        id="Titre"
                        name="Titre"
                        placeholder="Ex: Renard roux"
                        autocomplete="off"
                        required
                    />
                    <div id="suggestions"></div>
                </div>

                <label for="Description">Description</label>
                <textarea
                    id="Description"
                    name="Description"
                    placeholder="Décrivez votre observation..."
                ></textarea>

                <label for="Localisation">Nom du lieu *</label>
                <input
                    type="text"
                    id="Localisation"
                    name="Localisation"
                    placeholder="Ex: Forêt de Soignes"
                    required
                />

                <label>Épingler l'emplacement sur la carte *</label>
                <div id="map-picker"></div>

                <div class="coords">
                    <div>
                        <label for="Latitude">Latitude</label>
                        <input
                            type="number"
                            id="Latitude"
                            name="Latitude"
                            step="any"
                            readonly
                            required
                        />
                    </div>
                    <div>
                        <label for="Longitude">Longitude</label>
                        <input
                            type="number"
                            id="Longitude"
                            name="Longitude"
                            step="any"
                            readonly
                            required
                        />
                    </div>
                </div>

                <label for="Photo">Photo *</label>
                <input
                    type="file"
                    id="Photo"
                    name="Photo"
                    accept="image/*"
                    required
                />

                <div class="button-group">
                    <a href="{{ url_for('main.index') }}" class="btn-back"
                        >Annuler</a
                    >
                    <button type="submit">Publier</button>
                </div>
            </form>
        </div>

        <script>
            /** 1. MAP PICKER LOGIC **/
            var map = L.map("map-picker").setView([50.45, 3.95], 10);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OSM",
            }).addTo(map);

            var marker;
            map.on("click", function (e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                document.getElementById("Latitude").value = lat.toFixed(6);
                document.getElementById("Longitude").value = lng.toFixed(6);
                if (marker) {
                    marker.setLatLng(e.latlng);
                } else {
                    marker = L.marker(e.latlng).addTo(map);
                }
            });

            /** 2. ANIMAL AUTOCOMPLETE LOGIC **/
            const titreInput = document.getElementById("Titre");
            const suggestionsBox = document.getElementById("suggestions");

            titreInput.addEventListener("input", async () => {
                const query = titreInput.value;
                if (query.length < 2) {
                    suggestionsBox.style.display = "none";
                    return;
                }

                try {
                    const response = await fetch(`/api/animals?q=${query}`);
                    const animals = await response.json();

                    if (animals.length > 0) {
                        suggestionsBox.innerHTML = "";
                        animals.forEach((animal) => {
                            const div = document.createElement("div");
                            div.className = "suggestion-item";
                            div.innerHTML = `
                                <strong>${animal.name}</strong>
                                <span class="scientific-name">${animal.scientific}</span>
                            `;
                            div.onclick = () => {
                                titreInput.value = animal.name;
                                suggestionsBox.style.display = "none";
                            };
                            suggestionsBox.appendChild(div);
                        });
                        suggestionsBox.style.display = "block";
                    } else {
                        suggestionsBox.style.display = "none";
                    }
                } catch (error) {
                    console.error("Autocomplete error:", error);
                }
            });

            // Close suggestions when clicking outside
            document.addEventListener("click", (e) => {
                if (e.target !== titreInput) {
                    suggestionsBox.style.display = "none";
                }
            });
        </script>
    </body>
</html>
