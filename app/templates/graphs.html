<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GAIA - Statistiques & Phylogénie</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <style>
            .dashboard-container { width: 100%; max-width: 1200px; margin: 20px auto; padding: 20px; font-family: 'Segoe UI', sans-serif; }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
            .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #edf2f7; }
            .card h3 { color: #2f855a; margin-bottom: 20px; border-bottom: 2px solid #f0fdf4; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }

            /* --- STYLE DE L'ARBRE --- */
            .tree-container { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; max-height: 500px; overflow-y: auto; }
            .tree-view, .tree-view ul { list-style: none; padding-left: 25px; }
            .tree-view li { position: relative; padding: 8px 0 8px 15px; border-left: 2px solid #cbd5e0; }
            .tree-view li::before { content: ""; position: absolute; top: 20px; left: 0; width: 15px; height: 2px; background: #cbd5e0; }
            .tree-view li:last-child { border-left: none; }
            .tree-view li:last-child::after { content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 20px; background: #cbd5e0; }
            .tree-node { background: white; border: 1px solid #cbd5e0; padding: 5px 12px; border-radius: 6px; display: inline-block; font-size: 0.9rem; }
            .tree-badge { font-size: 0.7rem; background: #e2e8f0; padding: 2px 6px; border-radius: 10px; color: #4a5568; margin-left: 8px; font-weight: bold; }

            /* --- GRILLE D'INVENTAIRE --- */
            .species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
            .species-card { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 10px; text-align: center; }
            .species-card strong { display: block; color: #166534; font-size: 0.9rem; }
            .species-card span { font-size: 0.75rem; color: #4ade80; text-transform: uppercase; font-weight: bold; }

            @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="user-info-block">
                <img src="{{ url_for('static', filename='Logo.png') }}" alt="GAIA Logo" class="nav-logo" />
                <span class="user-greeting">Data Dashboard</span>
            </div>
            <div class="nav-links-group" style="margin-left: auto;">
                <a href="{{ url_for('main.index') }}" class="btn btn-post"><i class="fa-solid fa-house"></i></a>
                <a href="{{ url_for('main.tableau') }}" class="btn btn-post"><i class="fa-solid fa-table"></i></a>
                <a href="{{ url_for('main.profile') }}" class="btn btn-post"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>

        <div class="dashboard-container">
            <h2 style="color: #2f855a; margin-bottom: 25px;"><i class="fa-solid fa-chart-line"></i> Statistiques GAIA</h2>

            <div class="grid-2">
                <div class="card">
                    <h3><i class="fa-solid fa-chart-pie"></i> Observations par Classe</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="card">
                    <h3><i class="fa-solid fa-clock-rotate-left"></i> Activité Temporelle</h3>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom: 25px;">
                <h3><i class="fa-solid fa-sitemap"></i> Arbre Phylogénétique de GAIA</h3>
                <div class="tree-container" id="phylogenetic-tree">
                    </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-leaf"></i> Inventaire de la Biodiversité</h3>
                <div class="species-grid">
                    {% for s in all_species %}
                    <div class="species-card">
                        <strong>{{ s.Nom }}</strong>
                        <span>{{ s.Classe or 'Inconnu' }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            // --- CHARTS (Chart.js) ---
            const classeLabels = [{% for item in classe_dist %}"{{ item.Classe or 'Inconnu' }}",{% endfor %}];
            const classeData = [{% for item in classe_dist %}{{ item.count }},{% endfor %}];
            new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: { labels: classeLabels, datasets: [{ data: classeData, backgroundColor: ['#48bb78', '#4299e1', '#ed8936', '#9f7aea', '#f56565'] }] }
            });

            const evolutionLabels = [{% for item in post_growth %}"{{ item.date }}",{% endfor %}];
            const evolutionData = [{% for item in post_growth %}{{ item.count }},{% endfor %}];
            new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: { labels: evolutionLabels, datasets: [{ label: 'Posts', data: evolutionData, borderColor: '#48bb78', tension: 0.3, fill: true, backgroundColor: 'rgba(72, 187, 120, 0.1)' }] }
            });

            // --- LOGIQUE DE L'ARBRE STATIQUE ---
            const speciesData = {{ all_species | tojson }};

            function buildTree(parentId, container) {
                const children = speciesData.filter(s => s.Parent_Id === parentId);
                if (children.length === 0) return;

                const ul = document.createElement('ul');
                ul.className = "tree-view";

                children.forEach(child => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="tree-node">
                            <strong>${child.Nom}</strong>
                            ${child.Classe ? `<span class="tree-badge">${child.Classe}</span>` : ''}
                        </div>
                    `;
                    buildTree(child.Id, li);
                    ul.appendChild(li);
                });
                container.appendChild(ul);
            }

            // On lance la construction à partir de la racine (Parent_Id = null)
            buildTree(null, document.getElementById('phylogenetic-tree'));
        </script>
    </body>
</html>
