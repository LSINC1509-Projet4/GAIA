<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Validation des Observations - GAIA</title>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

        <style>
            /* --- 1. BASE (Inspired by your CSS) --- */
            body {
                margin: 0;
                padding: 0;
                background: linear-gradient(135deg, #ccfcd4 0%, #9df8b4 100%);
                font-family: "Segoe UI", Tahoma, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center; /* Horizontal center */
                align-items: center; /* Vertical center */
                overflow: hidden; /* Prevent scrolling during swipe */
            }

            /* --- 2. TINDER STACK CONTAINER --- */
            .tinder-container {
                position: relative;
                height: 550px;
                width: 100%;
                max-width: 400px;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1;
            }

            /* --- 3. SWIPE CARD --- */
            .swipe-card {
                position: absolute;
                width: 90%;
                max-width: 380px;
                background-color: rgba(255, 255, 255, 0.98);
                padding: 20px;
                border-radius: 20px;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
                box-sizing: border-box;
                transition:
                    transform 0.3s ease,
                    opacity 0.3s ease;
                cursor: grab;
                border-bottom: 8px solid #48bb78; /* Your green */

                /* Initial centering */
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                touch-action: none; /* Critical for mobile swipe */
            }

            .swipe-card:active {
                cursor: grabbing;
            }

            .swipe-card img {
                width: 100%;
                height: 280px;
                object-fit: cover;
                border-radius: 12px;
                pointer-events: none;
                margin-bottom: 15px;
            }

            .post-title {
                font-size: 1.4rem;
                margin: 0 0 5px 0;
                color: #1a202c;
                font-weight: 700;
                text-transform: uppercase;
            }

            .post-meta {
                font-size: 0.85rem;
                color: #718096;
                margin-bottom: 10px;
            }

            .location-tag {
                color: #2f855a;
                font-weight: 600;
            }

            /* --- 4. SWIPE STAMPS --- */
            .status-stamp {
                position: absolute;
                top: 40px;
                padding: 10px 20px;
                border-radius: 10px;
                font-weight: 900;
                font-size: 1.5rem;
                opacity: 0;
                z-index: 10;
                pointer-events: none;
                border: 5px solid;
            }
            .stamp-verify {
                color: #48bb78;
                border-color: #48bb78;
                right: 30px;
                transform: rotate(15deg);
            }
            .stamp-edit {
                color: #ecc94b;
                border-color: #ecc94b;
                left: 30px;
                transform: rotate(-15deg);
            }

            /* --- 5. EDIT OVERLAY --- */
            .edit-form-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(26, 32, 44, 0.85);
                z-index: 2000;
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(5px);
            }

            .edit-modal {
                background: white;
                padding: 30px;
                border-radius: 15px;
                width: 90%;
                max-width: 400px;
                box-shadow: 0 20px 25px rgba(0, 0, 0, 0.2);
            }

            .edit-input {
                width: 100%;
                padding: 12px;
                margin: 15px 0;
                border: 2px solid #e2e8f0;
                border-radius: 8px;
                font-size: 1rem;
                box-sizing: border-box;
            }

            .btn-confirm {
                background-color: #48bb78;
                color: white;
                border: none;
                padding: 12px;
                width: 100%;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
            }

            .btn-cancel {
                background: none;
                border: none;
                color: #718096;
                width: 100%;
                margin-top: 10px;
                cursor: pointer;
            }

            .empty-state {
                text-align: center;
                color: #22543d;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div class="tinder-container" id="tinder-stack">
            {% for post in posts %}
            <div
                class="swipe-card"
                data-id="{{ post.Id }}"
                data-titre="{{ post.Titre }}"
            >
                <div class="status-stamp stamp-verify">VALIDER</div>
                <div class="status-stamp stamp-edit">MODIFIER</div>

                <img
                    src="{{ url_for('static', filename='uploads/' + post.Photo) }}"
                    alt="Observation"
                />
                <h2 class="post-title">{{ post.Titre }}</h2>
                <div class="post-meta">
                    <span class="location-tag">📍 {{ post.Localisation }}</span>
                </div>
                <p style="color: #4a5568">{{ post.Description }}</p>
            </div>
            {% else %}
            <div class="empty-state">
                <h2>Bravo !</h2>
                <p>Toutes les observations ont été vérifiées.</p>
                <a href="{{ url_for('main.index') }}" style="color: #2f855a"
                    >Retour à l'accueil</a
                >
            </div>
            {% endfor %}
        </div>

        <div id="edit-overlay" class="edit-form-overlay">
            <div class="edit-modal">
                <h3>📝 Corriger l'espèce</h3>
                <form id="edit-form" method="POST">
                    <input type="hidden" id="edit-post-id" name="post_id" />
                    <label for="edit-titre">Nouveau nom :</label>
                    <input
                        type="text"
                        id="edit-titre"
                        name="Titre"
                        class="edit-input"
                    />
                    <button type="submit" class="btn-confirm">
                        Enregistrer & Valider
                    </button>
                    <button
                        type="button"
                        onclick="closeEdit()"
                        class="btn-cancel"
                    >
                        Annuler
                    </button>
                </form>
            </div>
        </div>

        <script>
            function initSwipe() {
                const cards = document.querySelectorAll(".swipe-card");

                cards.forEach((card, index) => {
                    const hammer = new Hammer(card);
                    const verifyStamp = card.querySelector(".stamp-verify");
                    const editStamp = card.querySelector(".stamp-edit");

                    // Movement during drag
                    hammer.on("pan", (e) => {
                        const xProgress = e.deltaX / 150;
                        card.style.transform = `translate(calc(-50% + ${e.deltaX}px), calc(-50% + ${e.deltaY}px)) rotate(${e.deltaX / 20}deg)`;

                        // Show stamps
                        if (e.deltaX > 50) {
                            verifyStamp.style.opacity = Math.min(xProgress, 1);
                            editStamp.style.opacity = 0;
                        } else if (e.deltaX < -50) {
                            editStamp.style.opacity = Math.min(
                                Math.abs(xProgress),
                                1,
                            );
                            verifyStamp.style.opacity = 0;
                        } else {
                            verifyStamp.style.opacity = 0;
                            editStamp.style.opacity = 0;
                        }
                    });

                    // Action on release
                    hammer.on("panend", (e) => {
                        if (e.deltaX > 150) {
                            // SWIPE RIGHT -> VALIDATE
                            card.style.transform = `translate(1000px, ${e.deltaY}px) rotate(45deg)`;
                            card.style.opacity = "0";
                            validatePost(card.dataset.id, card.dataset.titre);
                        } else if (e.deltaX < -150) {
                            // SWIPE LEFT -> EDIT
                            card.style.transform = `translate(-1000px, ${e.deltaY}px) rotate(-45deg)`;
                            card.style.opacity = "0";
                            openEdit(card.dataset.id, card.dataset.titre);
                        } else {
                            // CANCEL / RESET
                            card.style.transform = "translate(-50%, -50%)";
                            verifyStamp.style.opacity = 0;
                            editStamp.style.opacity = 0;
                        }
                    });
                });
            }

            async function validatePost(id, titre) {
                const formData = new FormData();
                formData.append("post_id", id);
                formData.append("Titre", titre);

                await fetch("{{ url_for('main.validation_post') }}", {
                    method: "POST",
                    body: formData,
                });
                // Optionally remove card from DOM instead of reload
                location.reload();
            }

            function openEdit(id, titre) {
                document.getElementById("edit-post-id").value = id;
                document.getElementById("edit-titre").value = titre;
                document.getElementById("edit-overlay").style.display = "flex";
            }

            function closeEdit() {
                document.getElementById("edit-overlay").style.display = "none";
                // Reset cards if modification is cancelled
                location.reload();
            }

            // Run on load
            document.addEventListener("DOMContentLoaded", initSwipe);
        </script>
    </body>
</html>
