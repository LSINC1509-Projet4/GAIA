<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA Dashboard</title>
    <link rel="icon" type="image/x-icon" href="static/Logo.png">
    <link rel="stylesheet" href="static/css/index.css">
</head>
<body>

    <div class="container">
        <img src="static/Logo.png" alt="GAIA Logo" onerror="this.style.display='none'">
        
        <h1>Dashboard</h1>
        
        <div class="user-info">
            <p>Welcome back, <strong>{{ current_user.username }}</strong>!</p>
            <span class="role-badge">{{ current_user.role }}</span>
        </div>

        <p>You have successfully authenticated to the GAIA system.</p>

        <div class="button-group">
            <a href="{{ url_for('auth.logout') }}" class="btn btn-logout">Sign Out</a>
        </div>
    </div>

</body>
</html>
